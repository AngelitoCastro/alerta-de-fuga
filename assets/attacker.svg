<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="attacker-title attacker-desc">
  <title id="attacker-title">Modelo de amenaza de interceptación</title>
  <desc id="attacker-desc">Diagrama de canal sin cifrar entre cliente y servidor expuesto a observación en tránsito.</desc>
  <rect x="4" y="4" width="152" height="112" rx="10" fill="#0B1016" stroke="#2A394A" stroke-width="2" />
  <!-- Nodos cliente y servidor -->
  <rect x="14" y="20" width="34" height="26" rx="4" fill="#131B26" stroke="#5C7691" stroke-width="2" />
  <rect x="20" y="27" width="22" height="4" rx="1.5" fill="#A8B8C8" />
  <rect x="20" y="34" width="14" height="4" rx="1.5" fill="#5C7691" />
  <rect x="112" y="20" width="34" height="26" rx="4" fill="#131B26" stroke="#5C7691" stroke-width="2" />
  <rect x="118" y="27" width="22" height="4" rx="1.5" fill="#A8B8C8" />
  <rect x="118" y="34" width="14" height="4" rx="1.5" fill="#5C7691" />
  <!-- Canal sin TLS -->
  <line x1="48" y1="33" x2="112" y2="33" stroke="#FF6B6B" stroke-width="2.2" stroke-dasharray="5 4" />
  <!-- Paquete en texto plano -->
  <rect x="65" y="18" width="30" height="16" rx="3" fill="#2F252E" stroke="#F0B429" stroke-width="1.8" />
  <line x1="71" y1="24" x2="89" y2="24" stroke="#F0B429" stroke-width="2" stroke-linecap="round" />
  <line x1="71" y1="29" x2="83" y2="29" stroke="#F0B429" stroke-width="2" stroke-linecap="round" />
  <!-- Observador en ruta -->
  <line x1="80" y1="36" x2="80" y2="56" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="80" cy="68" r="11" fill="#131B26" stroke="#FF6B6B" stroke-width="2" />
  <path d="M58 102 C58 88 67 80 80 80 C93 80 102 88 102 102 Z" fill="#2F252E" stroke="#FF6B6B" stroke-width="2" />
  <!-- Señal de alerta -->
  <polygon points="80,85 87,97 73,97" fill="#FF6B6B" />
  <line x1="80" y1="89" x2="80" y2="93" stroke="#0B1016" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="80" cy="95.2" r="1" fill="#0B1016" />
</svg>
